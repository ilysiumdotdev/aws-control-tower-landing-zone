      deploymentTargets:
        organizationalUnits:
          - Security
          - Infrastructure
          - Workloads
          - Workloads/Sandbox
          - Workloads/Dev
          - Workloads/Staging
          - Workloads/Prod
    # # BACKUP_PLAN_MIN_FREQUENCY_AND_MIN_RETENTION_CHECK
    # #   - Checks if a backup plan has a backup rule that satisfies the required frequency and retention period
