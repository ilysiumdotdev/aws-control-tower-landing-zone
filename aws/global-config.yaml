      enable: true
      deploymentTargets:
        organizationalUnits:
          - Security
          - Infrastructure
          - Workloads
          - Workloads/Sandbox
          - Workloads/Dev
          - Workloads/Staging
          - Workloads/Prod
    # # AWS-GR_RESTRICT_ROOT_USER_ACCESS_KEYS
    # #  - Disallow creation of access keys for the root user
