    # # AWS-GR_AUDIT_BUCKET_DELETION_PROHIBITED
    # #  - Disallow deletion of log archive
    - identifier: 3cerasw3dhjqcwatjqo2gk3wj
      enable: true
      deploymentTargets:
        organizationalUnits:
          - Security
    # # AWS-GR_CLOUDTRAIL_CHANGE_PROHIBITED
    # #  - Disallow configuration changes to AWS CloudTrail
    - identifier: 1iskvg0qcxofs1t78ittjbnr5
      enable: true
      deploymentTargets:
        organizationalUnits:
          - Security
          - Infrastructure
          - Workloads
          - Workloads/Sandbox
          - Workloads/Dev
          - Workloads/Staging
          - Workloads/Prod
    # # AWS-GR_NO_UNRESTRICTED_ROUTE_TO_IGW
    # #   - Detect whether public routes exist in the route table for an Internet Gateway (IGW)
    - identifier: b8pjfqosgkgknznstduvel4rh
      enable: true
      deploymentTargets:
        organizationalUnits:
          - Security
          - Infrastructure
          - Workloads
          - Workloads/Sandbox
          - Workloads/Dev
          - Workloads/Staging
          - Workloads/Prod
    # # AWS-GR_RESTRICT_ROOT_USER
    # #  - Disallow actions as a root user
