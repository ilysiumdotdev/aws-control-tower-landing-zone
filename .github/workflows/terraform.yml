name: Terraform Run

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
  pull_request:
    paths:
      - terraform/**

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:v.1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
  
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Terraform Init
        working-directory: terraform/
        run: |
          terraform init
      
      - name: Terraform Plan
        id: plan
        working-directory: terraform/
        run: |
          terraform plan -no-color -out=tfplan
          terraform show tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1
  
  apply:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    environment: accelerator
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:v.1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Terraform Init
        working-directory: terraform/
        run: |
          terraform init
    
      - name: Download Plan Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: tfplan
          path: terraform/
      
      - name: Terraform Apply
        working-directory: terraform/
        run:
          terraform apply -auto-approve tfplan
      
        


        