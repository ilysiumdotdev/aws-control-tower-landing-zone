name: Deploy Accelerator

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
  pull_request:
    paths:
      - terraform/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:22.23.5@sha256:81ad3f93f122008a146891525948c689cfd8e9ff9f8cb8445cc95991d7a0251c

    permissions:
      contents: read

    outputs:
      lza_version: ${{ steps.lza_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read LZA version
        id: lza_version
        run: |
          version="$(cat $GITHUB_WORKSPACE/lza-version.txt)"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Checkout LZA repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awslabs/landing-zone-accelerator-on-aws
          ref: release/${{ steps.lza_version.outputs.version }}
          path: lza

      - name: Export LZA source
        working-directory: lza/
        run: |
          apt-get update && apt-get install -y zip
          zip -q -T -r "$GITHUB_WORKSPACE/lza.zip" .

      - name: Build LZA packages
        working-directory: lza/source/
        run: |
          yarn install && yarn build

      - name: Export installer CloudFormation template
        working-directory: lza/source/packages/@aws-accelerator/installer/
        run: |
          npx cdk synth --context use-s3-source=true
          cp cdk.out/AWSAccelerator-InstallerStack.template.json \
             "$GITHUB_WORKSPACE/AWSAccelerator-InstallerStack-${LZA_VERSION}.template.json"

      - name: Upload LZA source artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lza_source
          path: lza.zip
          retention-days: 1

      - name: Upload installer template artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer_template
          path: AWSAccelerator-InstallerStack.template.json
          retention-days: 1

  plan:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:v.1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download LZA source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: lza_source
          path: terraform/

      - name: Download LZA source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: installer_template
          path: terraform/

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/
        run: |
          terraform init

      - name: Terraform plan
        id: plan
        working-directory: terraform/
        env:
          LZA_VERSION: ${{ needs.build.outputs.lza_version }}
          LZA_SOURCE_CODE_ZIP_FILE: lza.zip
          LZA_INSTALLER_TEMPLATE_FILE: "AWSAccelerator-InstallerStack.template.json"
        run: |
          terraform plan \
            -var="lza_version=$LZA_VERSION" \
            -var="lza_source_code_zip_file=$LZA_SOURCE_CODE_ZIP_FILE" \
            -var="lza_installer_template_file=$LZA_INSTALLER_TEMPLATE_FILE" \
            -out=tfplan \
            -no-color

          terraform show tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: [build, plan]
    environment: accelerator
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:v.1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download LZA source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: lza_source
          path: terraform/

      - name: Download LZA source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: installer_template
          path: terraform/

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/
        run: |
          terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v 8.0.2
        with:
          name: tfplan
          path: terraform/

      - name: Terraform apply
        working-directory: terraform/
        run: |
          terraform apply -auto-approve tfplan
